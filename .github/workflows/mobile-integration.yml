name: Mobile integration CPU tests
on:
  pull_request:
    paths:
      - 'elefant/**'
      - 'scripts/download_checkpoints.py'
      - 'tests/integration/**'
      - '.github/workflows/mobile-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-components:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Preserve exact tested source
        run: |
          mkdir -p outputs
          git rev-parse HEAD > outputs/tested-revision.txt
          git archive --format=tar.gz HEAD > outputs/mobile-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-source-snapshot
          path: |
            outputs/mobile-source.tar.gz
            outputs/tested-revision.txt
          retention-days: 3
          if-no-files-found: error
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated CPU test dependencies
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy pytest
      - name: Run unit, causality, replay and synthetic-training tests
        run: python -m pytest -q tests/integration --junitxml=outputs/mobile-tests.xml
      - name: Syntax and downloader dry-run
        run: |
          python -m compileall -q elefant/integration elefant/mobile elefant/policy_model/train.py
          python scripts/download_checkpoints.py 1200M --dry-run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-cpu-test-results
          path: outputs/mobile-tests.xml
          if-no-files-found: ignore
